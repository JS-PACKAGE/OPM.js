name: Manual npm release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact package version (1.3.0 uses tag v1.3; nonzero patch versions use full tags)
        required: true
        type: string
      reviewed_commit:
        description: Full commit SHA covered by the A/B/C/D security review
        required: true
        type: string
      review_record:
        description: HTTPS GitHub issue or pull request URL containing the security review and package verification record
        required: true
        type: string
      publish:
        description: Actually publish (false only verifies and dry-runs)
        default: false
        type: boolean
      confirmation:
        description: For publication enter publish opm.js@VERSION exactly
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: npm-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: npm-release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.0.0'
      - name: Validate immutable release identity and review record
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          REVIEWED_COMMIT: ${{ inputs.reviewed_commit }}
          REVIEW_RECORD: ${{ inputs.review_record }}
          PUBLISH: ${{ inputs.publish }}
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';
          const pkg = JSON.parse(readFileSync('package.json', 'utf8'));
          assert.equal(pkg.name, 'opm.js');
          assert.match(process.env.RELEASE_VERSION, /^\d+\.\d+\.\d+$/);
          assert.equal(pkg.version, process.env.RELEASE_VERSION);
          const parts = pkg.version.split('.');
          const releaseTag = parts[2] === '0' ? `v${parts[0]}.${parts[1]}` : `v${pkg.version}`;
          assert.equal(process.env.GITHUB_REF, `refs/tags/${releaseTag}`);
          assert.equal(process.env.REVIEWED_COMMIT, process.env.GITHUB_SHA);
          assert.match(process.env.REVIEWED_COMMIT, /^[0-9a-f]{40}$/);
          const record = new URL(process.env.REVIEW_RECORD);
          assert.equal(record.origin, 'https://github.com');
          assert.ok(record.pathname.startsWith(`/${process.env.GITHUB_REPOSITORY}/issues/`) || record.pathname.startsWith(`/${process.env.GITHUB_REPOSITORY}/pull/`));
          const headers = { 'Accept': 'application/vnd.github+json', 'User-Agent': 'opm-release-verifier' };
          const issue = /^\/([^/]+)\/([^/]+)\/(?:issues|pull)\/(\d+)$/.exec(record.pathname);
          assert.ok(issue, 'Review record must identify one issue or pull request');
          const reviewResponse = await fetch(`https://api.github.com/repos/${process.env.GITHUB_REPOSITORY}/issues/${issue[3]}`, { headers });
          assert.equal(reviewResponse.status, 200, 'Review record must be publicly readable');
          const review = await reviewResponse.json();
          assert.ok(typeof review.body === 'string' && review.body.includes(process.env.GITHUB_SHA), 'Review must cover this exact commit');
          for (const section of ['A', 'B', 'C', 'D', 'Package verification']) {
            assert.ok(review.body.split('\n').some(line => line.trim() === `${section}: PASS`), `Missing affirmative ${section} review`);
          }
          const releaseResponse = await fetch(`https://api.github.com/repos/${process.env.GITHUB_REPOSITORY}/releases/tags/${releaseTag}`, { headers });
          assert.equal(releaseResponse.status, 200, 'Create the reviewed GitHub release before publication');
          const release = await releaseResponse.json();
          assert.equal(release.draft, false);
          assert.equal(release.prerelease, false);
          if (process.env.PUBLISH === 'true') assert.equal(process.env.CONFIRMATION, `publish opm.js@${pkg.version}`);
          JS
      - name: Install exact OIDC-capable npm CLI
        run: npm install --global npm@11.6.0 --ignore-scripts
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run typecheck
      - run: npm audit
      - run: npm audit --omit=dev
      - name: Verify installed tarball, manifest, declarations and runtime-zero-dependency security gates
        run: npm run security -- --package-smoke
      - run: npm run sound-quality
      - run: npm run voice-quality
      - name: Verify production Vite deployment
        run: |
          npx --no-install playwright install --with-deps chromium
          npm run browser-smoke -- chromium
          npm run browser-stress -- chromium
          npm run vite-smoke
      - name: Pack the verified package and dry-run publication
        run: |
          npm pack --pack-destination "$RUNNER_TEMP"
          npm publish "$RUNNER_TEMP/opm.js-${{ inputs.version }}.tgz" --dry-run --ignore-scripts --access public --registry https://registry.npmjs.org
      - name: Record review identity and tarball digest
        env:
          REVIEW_RECORD: ${{ inputs.review_record }}
        run: |
          printf 'Commit: %s\nReview record: %s\n' "$GITHUB_SHA" "$REVIEW_RECORD" >> "$GITHUB_STEP_SUMMARY"
          sha256sum "$RUNNER_TEMP/opm.js-${{ inputs.version }}.tgz" >> "$GITHUB_STEP_SUMMARY"
      - name: Publish exact verified tarball using trusted npm OIDC and provenance
        if: inputs.publish
        run: npm publish "$RUNNER_TEMP/opm.js-${{ inputs.version }}.tgz" --ignore-scripts --provenance --access public --registry https://registry.npmjs.org
