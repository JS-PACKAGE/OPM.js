<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OPM.js — 4-op FM demo</title>
</head>
<body>
  <h1>OPM.js</h1>
  <p>Four-operator FM synthesis: held notes, stereo, key scaling and file tools.</p>
  <fieldset>
    <legend>Performance</legend>
    <label>Velocity <input id="velocity" type="range" min="0" max="1" step="0.05" value="0.8"></label>
    <label>Pan <input id="pan" type="range" min="-1" max="1" step="0.1" value="0"></label>
    <button id="play" type="button">Play chord</button>
    <button id="hold" type="button">Hold note</button>
    <button id="release" type="button" disabled>Release note</button>
    <button id="scaling" type="button">Hear key scaling</button>
    <button id="suspend" type="button">Suspend audio</button>
    <button id="resume" type="button">Resume audio</button>
  </fieldset>
  <fieldset>
    <legend>Voice and PCM files</legend>
    <label>DX7 SysEx (approximate 6-to-4 operator conversion)
      <input id="dx7" type="file" accept=".syx">
    </label>
    <label>Voice <select id="voice"><option value="brass">brass</option></select></label>
    <button id="wav" type="button">Download stereo WAV</button>
    <button id="diagnostics" type="button">Show diagnostics</button>
  </fieldset>
  <p><output id="status" role="status" aria-live="polite"></output></p>
  <script type="module">
    import { OPM } from '../dist/api/index.js';
    import { renderNote, encodeWav } from '../dist/core/index.js';
    import { brass } from '../dist/voices/brass.js';
    import { importDX7, describeDX7 } from '../dist/voices/dx7.js';
    import { parseVoiceBank } from '../dist/voices/schema.js';

    const status = document.querySelector('#status');
    const release = document.querySelector('#release');
    const selector = document.querySelector('#voice');
    const voices = new Map([['brass', brass]]);
    let heldId = null;
    const opm = new OPM({ onEvent(event) {
      if (event.type === 'error') status.textContent = event.error.message;
      if (event.type === 'note' && event.state === 'rejected') {
        status.textContent = `Note rejected: ${event.reason}`;
      }
      if (event.type === 'note' && event.id === heldId &&
          ['ended', 'stolen', 'cancelled', 'rejected'].includes(event.state)) {
        heldId = null;
        release.disabled = true;
      }
    } });
    function options() {
      return {
        voice: selector.value,
        velocity: Number(document.querySelector('#velocity').value),
        pan: Number(document.querySelector('#pan').value),
      };
    }
    function action(id, run) {
      const button = document.querySelector(`#${id}`);
      button.addEventListener('click', async () => {
        button.disabled = true;
        try { await run(); }
        catch (error) { status.textContent = error.message; }
        finally { button.disabled = id === 'release' && heldId === null; }
      });
    }
    function addVoice(voice) {
      opm.loadVoice(voice.name, voice);
      voices.set(voice.name, voice);
      if (![...selector.options].some(option => option.value === voice.name)) {
        const option = document.createElement('option');
        option.value = voice.name;
        option.textContent = voice.name;
        selector.append(option);
      }
    }
    fetch('../dist/voices/examples.json')
      .then(response => {
        if (!response.ok) throw new Error(`Bundled bank HTTP ${response.status}`);
        return response.text();
      })
      .then(text => {
        for (const voice of parseVoiceBank(text).values()) {
          if (!voices.has(voice.name)) addVoice(voice);
        }
      })
      .catch(error => { status.textContent = error.message; });
    action('play', async () => {
      await opm.start();
      for (const note of [60, 64, 67]) opm.playNote({ ...options(), note, duration: 0.7 });
      status.textContent = `Playing ${selector.value} chord`;
    });
    action('hold', async () => {
      await opm.start();
      if (heldId !== null) opm.stop(heldId);
      heldId = opm.playNote({ ...options(), note: 60 });
      release.disabled = false;
      status.textContent = 'Holding note — press Release note to end the gate';
    });
    action('release', async () => {
      if (heldId !== null) opm.stop(heldId);
      heldId = null;
      status.textContent = 'Released note';
    });
    action('scaling', async () => {
      await opm.start();
      const voice = { ...brass, version: 2, ops: brass.ops.map(op => ({
        ...op, keyScale: { breakpoint: 60, leftDbPerOctave: 0, rightDbPerOctave: 12 },
      })) };
      [48, 60, 72, 84].forEach((note, index) => {
        opm.playNote({ voice, note, time: index * 0.35, duration: 0.3, velocity: 0.8 });
      });
      status.textContent = 'Playing key-scaled arpeggio: 12 dB attenuation per octave above C4';
    });
    action('suspend', async () => {
      await opm.start();
      await opm.context.suspend();
      status.textContent = 'Audio suspended';
    });
    action('resume', async () => {
      await opm.resume();
      status.textContent = `Audio ${opm.context.state}`;
    });
    document.querySelector('#dx7').addEventListener('change', async event => {
      try {
        const file = event.target.files[0];
        if (!file) return;
        // A standard DX7 bank is 4104 bytes; bound before buffering user input.
        if (file.size > 4104) throw new RangeError('DX7 SysEx exceeds one standard bank');
        const bytes = new Uint8Array(await file.arrayBuffer());
        const imported = importDX7(bytes);
        const descriptions = describeDX7(bytes);
        for (const voice of imported) addVoice(voice);
        selector.value = imported[0].name;
        status.textContent = `Imported ${imported.length} approximate DX7 voice(s). ${descriptions[0].warnings.join(' ')}`;
      } catch (error) { status.textContent = error.message; }
    });
    action('wav', async () => {
      const { left, right, sampleRate } = renderNote({
        voice: voices.get(selector.value), note: 60, duration: 0.7,
        velocity: options().velocity, pan: options().pan, sampleRate: 48000,
      });
      const url = URL.createObjectURL(new Blob([encodeWav({ left, right, sampleRate })], { type: 'audio/wav' }));
      const link = document.createElement('a');
      link.href = url;
      link.download = `${selector.value}.wav`;
      link.click();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
      status.textContent = 'Downloaded stereo PCM16 WAV';
    });
    action('diagnostics', async () => {
      await opm.start();
      const info = await opm.getDiagnostics();
      status.textContent = `${info.activeVoices} active voices; ${info.pendingEvents} pending events; ${info.errors} errors; ${info.rejectedNotes} rejected notes`;
    });
  </script>
</body>
</html>
