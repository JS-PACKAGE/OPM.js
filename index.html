<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OPM.js 測試頁面</title>
</head>
<body>
  <h1>OPM.js 測試頁面</h1>
  <p>播放完整的《小星星》旋律與和弦（約 24 秒）；和弦偏左、旋律偏右。</p>
  <button id="play" type="button">播放曲子</button>
  <button id="stop" type="button" disabled>停止</button>
  <output id="status" role="status" aria-live="polite"></output>
  <script type="module" src="./dist/demo/song.js"></script>
</body>
</html>
